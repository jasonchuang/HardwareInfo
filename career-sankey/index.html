<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的職涯 Sankey 圖</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2129;
    --text: #e6edf3;
    --muted: #8b949e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", -apple-system, sans-serif;
  }
  header {
    padding: 28px 36px 8px;
  }
  header h1 { margin: 0 0 6px; font-size: 26px; font-weight: 700; }
  header p  { margin: 0; color: var(--muted); font-size: 14px; }
  .banner {
    margin: 16px 36px 0;
    padding: 10px 16px;
    background: #3d2e0f;
    border: 1px solid #9e6a03;
    border-radius: 8px;
    color: #f0c674;
    font-size: 13px;
  }
  #chart-wrap {
    margin: 12px 16px 32px;
    padding: 16px;
    background: var(--panel);
    border-radius: 12px;
    overflow-x: auto;
  }
  svg { display: block; margin: 0 auto; }
  .node rect { cursor: default; }
  .node text {
    fill: var(--text);
    font-size: 13px;
    font-weight: 600;
    paint-order: stroke;
    stroke: rgba(15, 20, 25, 0.75);
    stroke-width: 3px;
  }
  .node text tspan.years { font-weight: 400; font-size: 11px; fill: var(--muted); }
  .link { fill: none; mix-blend-mode: screen; transition: stroke-opacity .15s; }
  .link:hover { stroke-opacity: 0.75 !important; }
  .link title { pointer-events: none; }
  footer { padding: 0 36px 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>Jason Chuang — 職涯流向圖 (Sankey)</h1>
  <p>流量寬度代表年資（年）。滑鼠移到流帶上可看細節。</p>
</header>

<div class="banner">
  ⚠️ 目前顯示的是「範例資料」。請編輯本檔案開頭 <code>careerData</code> 區塊，換成你真實的學歷、公司與職位經歷。
</div>

<div id="chart-wrap"></div>

<footer>純前端、零相依：vanilla JS + SVG，自含 Sankey 佈局實作，離線可開。</footer>

<script>
/* ============================================================
 * ✏️ 在這裡編輯你的職涯資料（範例資料，請替換）
 *
 * nodes:  每個節點屬於一個 stage（由左到右的欄位）。
 * links:  source/target 用節點名稱，value 通常填年資（年）。
 * ============================================================ */
const careerData = {
  stages: ["學歷", "早期", "中期", "近期", "現在"],
  nodes: [
    // stage 0 — 學歷
    { name: "資訊工程 學士", stage: 0 },
    { name: "資訊工程 碩士", stage: 0 },
    // stage 1 — 早期職涯
    { name: "Android 工程師\n(公司 A)", stage: 1 },
    // stage 2 — 中期
    { name: "資深 Android 工程師\n(公司 B)", stage: 2 },
    { name: "Side Projects\n(HardwareInfo 等)", stage: 2 },
    // stage 3 — 近期
    { name: "Tech Lead\n(公司 C)", stage: 3 },
    { name: "全端開發", stage: 3 },
    // stage 4 — 現在
    { name: "工程主管 / 架構師", stage: 4 },
  ],
  links: [
    { source: "資訊工程 學士", target: "資訊工程 碩士",                value: 2 },
    { source: "資訊工程 碩士", target: "Android 工程師\n(公司 A)",      value: 2 },
    { source: "Android 工程師\n(公司 A)", target: "資深 Android 工程師\n(公司 B)", value: 3 },
    { source: "Android 工程師\n(公司 A)", target: "Side Projects\n(HardwareInfo 等)", value: 1 },
    { source: "資深 Android 工程師\n(公司 B)", target: "Tech Lead\n(公司 C)", value: 3 },
    { source: "Side Projects\n(HardwareInfo 等)", target: "全端開發",   value: 1 },
    { source: "資深 Android 工程師\n(公司 B)", target: "全端開發",      value: 1 },
    { source: "Tech Lead\n(公司 C)", target: "工程主管 / 架構師",        value: 3 },
    { source: "全端開發", target: "工程主管 / 架構師",                   value: 2 },
  ],
};

/* ============================================================
 * 以下為 Sankey 佈局與繪製實作，一般不需修改
 * ============================================================ */
(function render(data) {
  const NODE_WIDTH = 18;
  const NODE_GAP = 28;
  const WIDTH = Math.max(960, data.stages.length * 230);
  const HEIGHT = 520;
  const PAD = { top: 48, right: 170, bottom: 24, left: 16 };

  const palette = ["#4c9aff", "#57d9a3", "#f5a623", "#e36bae", "#9d6bff",
                   "#36b3c9", "#ff7a59", "#a3cb38", "#f76e8c", "#6f86d6"];

  // --- 建索引、計算每個節點的流量 ---
  const nodes = data.nodes.map((n, i) => ({ ...n, index: i, color: palette[i % palette.length] }));
  const byName = new Map(nodes.map(n => [n.name, n]));
  const links = data.links.map(l => ({
    source: byName.get(l.source),
    target: byName.get(l.target),
    value: l.value,
  }));
  for (const l of links) {
    if (!l.source || !l.target) throw new Error("links 裡有對不到的節點名稱");
  }
  nodes.forEach(n => {
    n.out = links.filter(l => l.source === n).reduce((s, l) => s + l.value, 0);
    n.in  = links.filter(l => l.target === n).reduce((s, l) => s + l.value, 0);
    n.flow = Math.max(n.out, n.in, 0.5);
  });

  // --- 垂直比例尺：讓最高的 stage 剛好塞滿可用高度 ---
  const stageCount = data.stages.length;
  const innerH = HEIGHT - PAD.top - PAD.bottom;
  let scale = Infinity;
  for (let s = 0; s < stageCount; s++) {
    const col = nodes.filter(n => n.stage === s);
    const total = col.reduce((sum, n) => sum + n.flow, 0);
    const avail = innerH - NODE_GAP * Math.max(0, col.length - 1);
    scale = Math.min(scale, avail / total);
  }

  // --- 節點座標 ---
  const innerW = WIDTH - PAD.left - PAD.right - NODE_WIDTH;
  for (let s = 0; s < stageCount; s++) {
    const col = nodes.filter(n => n.stage === s);
    const colH = col.reduce((sum, n) => sum + n.flow * scale, 0) + NODE_GAP * Math.max(0, col.length - 1);
    let y = PAD.top + (innerH - colH) / 2;
    const x = PAD.left + (stageCount === 1 ? 0 : innerW * (s / (stageCount - 1)));
    for (const n of col) {
      n.x = x;
      n.y = y;
      n.h = n.flow * scale;
      y += n.h + NODE_GAP;
    }
  }

  // --- 每個節點上，連線的起訖 offset ---
  nodes.forEach(n => { n.outOffset = 0; n.inOffset = 0; });
  // 依目標/來源的 y 排序，減少交叉
  const outLinks = [...links].sort((a, b) => a.target.y - b.target.y || a.source.y - b.source.y);
  for (const l of outLinks) {
    l.width = l.value * scale;
    l.y0 = l.source.y + l.source.outOffset + l.width / 2;
    l.source.outOffset += l.width;
  }
  const inLinks = [...links].sort((a, b) => a.source.y - b.source.y || a.target.y - b.target.y);
  for (const l of inLinks) {
    l.y1 = l.target.y + l.target.inOffset + l.width / 2;
    l.target.inOffset += l.width;
  }

  // --- 繪製 SVG ---
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("width", WIDTH);
  svg.setAttribute("height", HEIGHT);
  svg.setAttribute("viewBox", `0 0 ${WIDTH} ${HEIGHT}`);

  // stage 標題
  for (let s = 0; s < stageCount; s++) {
    const x = PAD.left + (stageCount === 1 ? 0 : innerW * (s / (stageCount - 1))) + NODE_WIDTH / 2;
    const t = document.createElementNS(NS, "text");
    t.setAttribute("x", x);
    t.setAttribute("y", 26);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("fill", "#8b949e");
    t.setAttribute("font-size", "13");
    t.setAttribute("font-weight", "700");
    t.textContent = data.stages[s];
    svg.appendChild(t);
  }

  // 連線（漸層）
  const defs = document.createElementNS(NS, "defs");
  svg.appendChild(defs);
  links.forEach((l, i) => {
    const gid = "grad" + i;
    const grad = document.createElementNS(NS, "linearGradient");
    grad.setAttribute("id", gid);
    grad.setAttribute("gradientUnits", "userSpaceOnUse");
    grad.setAttribute("x1", l.source.x + NODE_WIDTH);
    grad.setAttribute("x2", l.target.x);
    const s0 = document.createElementNS(NS, "stop");
    s0.setAttribute("offset", "0%");
    s0.setAttribute("stop-color", l.source.color);
    const s1 = document.createElementNS(NS, "stop");
    s1.setAttribute("offset", "100%");
    s1.setAttribute("stop-color", l.target.color);
    grad.append(s0, s1);
    defs.appendChild(grad);

    const x0 = l.source.x + NODE_WIDTH;
    const x1 = l.target.x;
    const mid = (x0 + x1) / 2;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("class", "link");
    path.setAttribute("d", `M${x0},${l.y0} C${mid},${l.y0} ${mid},${l.y1} ${x1},${l.y1}`);
    path.setAttribute("stroke", `url(#${gid})`);
    path.setAttribute("stroke-width", Math.max(1.5, l.width));
    path.setAttribute("stroke-opacity", "0.45");
    const title = document.createElementNS(NS, "title");
    title.textContent =
      `${l.source.name.replace(/\n/g, " ")} → ${l.target.name.replace(/\n/g, " ")}\n${l.value} 年`;
    path.appendChild(title);
    svg.appendChild(path);
  });

  // 節點
  nodes.forEach(n => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "node");

    const rect = document.createElementNS(NS, "rect");
    rect.setAttribute("x", n.x);
    rect.setAttribute("y", n.y);
    rect.setAttribute("width", NODE_WIDTH);
    rect.setAttribute("height", Math.max(2, n.h));
    rect.setAttribute("rx", 4);
    rect.setAttribute("fill", n.color);
    const title = document.createElementNS(NS, "title");
    title.textContent = `${n.name.replace(/\n/g, " ")}（${n.flow} 年）`;
    rect.appendChild(title);
    g.appendChild(rect);

    const lastStage = n.stage === stageCount - 1;
    const text = document.createElementNS(NS, "text");
    text.setAttribute("x", lastStage ? n.x - 8 : n.x + NODE_WIDTH + 8);
    text.setAttribute("text-anchor", lastStage ? "end" : "start");
    const lines = n.name.split("\n");
    const baseY = n.y + n.h / 2 - ((lines.length - 1) * 16) / 2 + 4;
    lines.forEach((line, i) => {
      const tspan = document.createElementNS(NS, "tspan");
      tspan.setAttribute("x", text.getAttribute("x"));
      tspan.setAttribute("y", baseY + i * 16);
      tspan.textContent = line;
      text.appendChild(tspan);
    });
    const yrs = document.createElementNS(NS, "tspan");
    yrs.setAttribute("class", "years");
    yrs.setAttribute("x", text.getAttribute("x"));
    yrs.setAttribute("y", baseY + lines.length * 16);
    yrs.textContent = `${n.flow} 年`;
    text.appendChild(yrs);
    g.appendChild(text);

    svg.appendChild(g);
  });

  document.getElementById("chart-wrap").appendChild(svg);
})(careerData);
</script>

</body>
</html>
