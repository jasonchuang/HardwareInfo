<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-app-region: no-drag;
    }

    /* macOS-style title bar drag area */
    #titlebar {
      height: 38px;
      -webkit-app-region: drag;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f6f6;
      border-bottom: 1px solid #e0e0e0;
    }

    #titlebar span {
      font-size: 13px;
      color: #555;
      -webkit-app-region: no-drag;
    }

    #toolbar {
      padding: 8px 16px;
      background: #fafafa;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    #open-btn {
      padding: 5px 14px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    #open-btn:hover { background: #0066d6; }

    #file-path {
      font-size: 12px;
      color: #888;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Drop zone shown when no file loaded */
    #dropzone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #aaa;
      gap: 12px;
    }
    #dropzone.drag-over {
      background: #f0f7ff;
      color: #007AFF;
    }
    #dropzone svg { opacity: 0.4; }
    #dropzone p { font-size: 15px; }

    /* Markdown output */
    #preview {
      flex: 1;
      overflow-y: auto;
      padding: 32px 48px;
      display: none;
    }

    /* --- GitHub-flavored Markdown styles --- */
    #preview h1, #preview h2, #preview h3,
    #preview h4, #preview h5, #preview h6 {
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      font-weight: 600;
      line-height: 1.3;
    }
    #preview h1 { font-size: 2em; border-bottom: 1px solid #e0e0e0; padding-bottom: 0.3em; }
    #preview h2 { font-size: 1.5em; border-bottom: 1px solid #e0e0e0; padding-bottom: 0.3em; }
    #preview p  { margin: 0.8em 0; line-height: 1.7; }
    #preview a  { color: #007AFF; text-decoration: none; }
    #preview a:hover { text-decoration: underline; }
    #preview code {
      background: #f4f4f4;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: 'SF Mono', Menlo, Monaco, monospace;
      font-size: 0.88em;
    }
    #preview pre {
      background: #f4f4f4;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1em 0;
    }
    #preview pre code { background: none; padding: 0; }
    #preview blockquote {
      border-left: 4px solid #007AFF;
      margin: 1em 0;
      padding: 0.5em 1em;
      background: #f7f9ff;
      border-radius: 0 6px 6px 0;
    }
    #preview table { border-collapse: collapse; width: 100%; margin: 1em 0; }
    #preview th, #preview td {
      border: 1px solid #ddd;
      padding: 8px 12px;
      text-align: left;
    }
    #preview th { background: #f6f6f6; font-weight: 600; }
    #preview tr:nth-child(even) td { background: #fafafa; }
    #preview ul, #preview ol { padding-left: 1.5em; margin: 0.8em 0; }
    #preview li { margin: 0.3em 0; line-height: 1.7; }
    #preview hr { border: none; border-top: 1px solid #e0e0e0; margin: 1.5em 0; }
    #preview img { max-width: 100%; border-radius: 6px; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body        { background: #1e1e1e; color: #d4d4d4; }
      #titlebar   { background: #2a2a2a; border-color: #3a3a3a; }
      #titlebar span { color: #aaa; }
      #toolbar    { background: #252525; border-color: #3a3a3a; }
      #preview code, #preview pre { background: #2a2a2a; }
      #preview blockquote { background: #222f3e; }
      #preview th { background: #2a2a2a; }
      #preview tr:nth-child(even) td { background: #252525; }
      #preview h1, #preview h2 { border-color: #3a3a3a; }
      #preview table th, #preview table td { border-color: #3a3a3a; }
    }
  </style>
</head>
<body>
  <div id="titlebar"><span id="title-text">MD Viewer</span></div>

  <div id="toolbar">
    <button id="open-btn">Open File</button>
    <span id="file-path">No file opened</span>
  </div>

  <!-- Drop zone (shown when no file is loaded) -->
  <div id="dropzone">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="12" y1="13" x2="12" y2="17"/>
      <polyline points="9 16 12 19 15 16"/>
    </svg>
    <p>Drag a .md file here or click <strong>Open File</strong></p>
  </div>

  <!-- Rendered Markdown output -->
  <div id="preview"></div>

  <script src="renderer.js"></script>
</body>
</html>
